<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kitchen Timer</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0a0f;
      --text: #fff;
      --btn-bg: rgba(255,255,255,0.06);
      --btn-border: rgba(255,255,255,0.18);
      --btn-bg-primary: rgba(255,255,255,0.10);
      --btn-border-primary: rgba(255,255,255,0.28);
      --accent: #6ee7b7;
      --ring-track: rgba(255,255,255,0.08);
      --ring-fill: #6ee7b7;
      --progress-glow: rgba(110, 231, 183, 0.3);
    }

    .theme-light {
      color-scheme: light;
      --bg: #f5f5f5;
      --text: #1a1a1a;
      --btn-bg: rgba(0,0,0,0.05);
      --btn-border: rgba(0,0,0,0.15);
      --btn-bg-primary: rgba(0,0,0,0.08);
      --btn-border-primary: rgba(0,0,0,0.25);
      --accent: #10b981;
      --ring-track: rgba(0,0,0,0.08);
      --ring-fill: #10b981;
      --progress-glow: rgba(16, 185, 129, 0.3);
    }

    .theme-retro {
      --bg: #1a1a2e;
      --text: #00ff41;
      --btn-bg: rgba(0,255,65,0.08);
      --btn-border: rgba(0,255,65,0.3);
      --btn-bg-primary: rgba(0,255,65,0.15);
      --btn-border-primary: rgba(0,255,65,0.5);
      --accent: #00ff41;
      --ring-track: rgba(0,255,65,0.1);
      --ring-fill: #00ff41;
      --progress-glow: rgba(0,255,65,0.4);
    }

    .theme-neon {
      --bg: #0d0221;
      --text: #f472b6;
      --btn-bg: rgba(244,114,182,0.08);
      --btn-border: rgba(244,114,182,0.3);
      --btn-bg-primary: rgba(244,114,182,0.15);
      --btn-border-primary: rgba(244,114,182,0.5);
      --accent: #f472b6;
      --ring-track: rgba(244,114,182,0.1);
      --ring-fill: #f472b6;
      --progress-glow: rgba(244,114,182,0.4);
    }

    .theme-zen {
      --bg: #1c1917;
      --text: #d6d3d1;
      --btn-bg: rgba(214,211,209,0.06);
      --btn-border: rgba(214,211,209,0.15);
      --btn-bg-primary: rgba(214,211,209,0.10);
      --btn-border-primary: rgba(214,211,209,0.25);
      --accent: #a8a29e;
      --ring-track: rgba(214,211,209,0.08);
      --ring-fill: #a8a29e;
      --progress-glow: rgba(168,162,158,0.3);
    }

    * {
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      transition: background 1.5s ease, color 0.4s ease;
      overflow-x: hidden;
    }

    .app {
      width: min(960px, 100%);
      text-align: center;
      position: relative;
    }

    /* Timer ring area */
    .timer-area {
      position: relative;
      display: inline-block;
      margin-bottom: 18px;
    }

    .ring-container {
      position: relative;
      width: clamp(220px, 45vw, 340px);
      height: clamp(220px, 45vw, 340px);
      cursor: pointer;
    }

    .ring-svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .ring-track {
      fill: none;
      stroke: var(--ring-track);
      stroke-width: 8;
    }

    .ring-fill {
      fill: none;
      stroke: var(--ring-fill);
      stroke-width: 8;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.3s ease, stroke 0.5s ease;
      filter: drop-shadow(0 0 6px var(--progress-glow));
    }

    .ring-handle {
      fill: var(--ring-fill);
      filter: drop-shadow(0 0 8px var(--progress-glow));
      cursor: grab;
      transition: r 0.15s ease;
    }

    .ring-handle:hover {
      r: 12;
    }

    .ring-handle:active {
      cursor: grabbing;
    }

    #timeDisplay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-variant-numeric: tabular-nums;
      font-size: clamp(32px, 7vw, 64px);
      letter-spacing: 0.04em;
      line-height: 1.05;
      pointer-events: none;
      transition: transform 0.1s ease;
    }

    #timeDisplay.pulse {
      animation: pulse 1s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.06); }
    }

    /* Activity section */
    .activity-section {
      margin-bottom: 14px;
    }

    .activity-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
    }

    #activityInput {
      width: 200px;
      font-size: 16px;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid var(--btn-border);
      background: var(--btn-bg);
      color: var(--text);
      text-align: center;
      outline: none;
    }

    #activityInput::placeholder {
      opacity: 0.5;
    }

    .activity-presets {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
    }

    .activity-preset {
      font-size: 14px !important;
      padding: 6px 12px !important;
      border-radius: 20px !important;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Illustration canvas */
    .illustration-container {
      margin: 10px auto 16px;
      width: clamp(120px, 25vw, 180px);
      height: clamp(120px, 25vw, 180px);
      position: relative;
    }

    #illustrationCanvas {
      width: 100%;
      height: 100%;
      border-radius: 16px;
    }

    /* Controls */
    .controls {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      justify-items: center;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: center;
    }

    input[type="number"], button {
      font-size: 16px;
      padding: 14px 18px;
      border-radius: 14px;
      border: 1px solid var(--btn-border);
      background: var(--btn-bg);
      color: var(--text);
      transition: all 0.2s ease;
    }

    input[type="number"] {
      width: 160px;
      text-align: center;
      outline: none;
    }

    button {
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      min-height: 48px;
    }

    button:hover:not(:disabled) {
      background: var(--btn-bg-primary);
      border-color: var(--btn-border-primary);
    }

    button:active:not(:disabled) {
      transform: scale(0.96);
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .primary {
      border-color: var(--btn-border-primary);
      background: var(--btn-bg-primary);
      font-weight: 600;
      min-width: 100px;
    }

    .presets button {
      min-width: 64px;
      border-radius: 20px;
      padding: 10px 16px;
      font-weight: 500;
    }

    .bottom-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: center;
      margin-top: 4px;
    }

    .toggles {
      font-size: 14px;
      opacity: 0.9;
    }

    .toggles label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1px solid var(--btn-border);
      background: var(--btn-bg);
      cursor: pointer;
    }

    /* Sound theme picker */
    .sound-picker {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
    }

    .sound-picker button {
      font-size: 14px !important;
      padding: 6px 12px !important;
      border-radius: 20px !important;
      min-height: 36px;
    }

    .sound-picker button.active {
      border-color: var(--accent);
      background: var(--btn-bg-primary);
    }

    /* Theme picker */
    .theme-picker {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
    }

    .theme-picker button {
      font-size: 13px !important;
      padding: 6px 12px !important;
      border-radius: 20px !important;
      min-height: 36px;
    }

    .theme-picker button.active {
      border-color: var(--accent);
      background: var(--btn-bg-primary);
    }

    .fullscreen-btn {
      font-size: 14px !important;
      padding: 6px 12px !important;
      min-height: 36px;
    }

    .hint {
      margin-top: 14px;
      font-size: 13px;
      opacity: 0.5;
    }

    /* Confetti */
    .confetti-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9999;
      overflow: hidden;
    }

    .confetti-piece {
      position: absolute;
      width: 10px;
      height: 10px;
      top: -20px;
      animation: confetti-fall 3s ease-out forwards;
    }

    @keyframes confetti-fall {
      0% {
        transform: translateY(0) rotate(0deg) scale(1);
        opacity: 1;
      }
      100% {
        transform: translateY(100vh) rotate(720deg) scale(0.3);
        opacity: 0;
      }
    }

    /* Times up banner */
    .times-up {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-size: clamp(36px, 8vw, 72px);
      font-weight: 800;
      color: var(--accent);
      text-shadow: 0 0 40px var(--progress-glow);
      pointer-events: none;
      z-index: 10000;
      animation: times-up-pop 2s ease-out forwards;
      white-space: nowrap;
    }

    @keyframes times-up-pop {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
      15% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
      30% { transform: translate(-50%, -50%) scale(1); }
      80% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
    }

    /* Fun fact banner */
    #funFact {
      margin: 0 auto 12px;
      max-width: 380px;
      font-size: 13px;
      line-height: 1.5;
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px solid var(--btn-border);
      background: var(--btn-bg);
      opacity: 0.85;
      transition: opacity 0.4s ease;
    }

    /* Stats bar */
    #statsBar {
      margin-top: 10px;
      font-size: 13px;
      opacity: 0.6;
    }

    /* Responsive */
    @media (max-width: 480px) {
      body { padding: 16px; }
      .ring-container {
        width: 200px;
        height: 200px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <!-- Activity input -->
    <section class="activity-section">
      <div class="activity-row">
        <input id="activityInput" type="text" placeholder="What are you timing?" maxlength="30" />
      </div>
      <div class="activity-presets">
        <button class="activity-preset" data-activity="pizza">🍕 Pizza</button>
        <button class="activity-preset" data-activity="laundry">👕 Laundry</button>
        <button class="activity-preset" data-activity="eggs">🥚 Eggs</button>
        <button class="activity-preset" data-activity="tea">🍵 Tea</button>
        <button class="activity-preset" data-activity="workout">💪 Workout</button>
        <button class="activity-preset" data-activity="quiche">🥧 Quiche</button>
        <button class="activity-preset" data-activity="nap">😴 Nap</button>
      </div>
    </section>

    <!-- Illustration -->
    <div class="illustration-container" id="illustrationContainer" style="display:none;">
      <canvas id="illustrationCanvas" width="180" height="180"></canvas>
    </div>

    <!-- Fun fact -->
    <div id="funFact" style="display:none;"></div>

    <!-- Timer ring -->
    <div class="timer-area">
      <div class="ring-container" id="ringContainer">
        <svg class="ring-svg" viewBox="0 0 200 200">
          <circle class="ring-track" cx="100" cy="100" r="88" />
          <circle class="ring-fill" id="ringFill" cx="100" cy="100" r="88"
                  stroke-dasharray="553" stroke-dashoffset="0" />
          <circle class="ring-handle" id="ringHandle" cx="100" cy="12" r="9" style="display:none;" />
        </svg>
        <div id="timeDisplay">00:00</div>
      </div>
    </div>

    <section class="controls">
      <div class="row">
        <input id="minutesInput" type="number" min="1" step="1" placeholder="Minutes" inputmode="numeric" />
      </div>

      <div class="row presets">
        <button class="preset" data-minutes="1">1m</button>
        <button class="preset" data-minutes="5">5m</button>
        <button class="preset" data-minutes="10">10m</button>
        <button class="preset" data-minutes="15">15m</button>
        <button class="preset" data-minutes="20">20m</button>
        <button class="preset" data-minutes="30">30m</button>
      </div>

      <div class="row">
        <button id="startButton" class="primary">Start</button>
        <button id="pauseButton">Pause</button>
        <button id="resetButton">Reset</button>
      </div>

      <!-- Sound themes -->
      <div class="row">
        <span style="font-size:13px;opacity:0.6;">Sound:</span>
        <div class="sound-picker">
          <button class="sound-theme active" data-sound="chime">🔔 Chime</button>
          <button class="sound-theme" data-sound="bell">🛎️ Bell</button>
          <button class="sound-theme" data-sound="gong">🎵 Gong</button>
          <button class="sound-theme" data-sound="arcade">👾 Arcade</button>
        </div>
      </div>

      <div class="bottom-controls">
        <div class="toggles">
          <label>
            <input id="notifyToggle" type="checkbox" />
            Notify
          </label>
        </div>

        <!-- Theme picker -->
        <div class="theme-picker">
          <button class="theme-btn active" data-theme="dark">Dark</button>
          <button class="theme-btn" data-theme="light">Light</button>
          <button class="theme-btn" data-theme="retro">Retro</button>
          <button class="theme-btn" data-theme="neon">Neon</button>
          <button class="theme-btn" data-theme="zen">Zen</button>
        </div>

        <button class="fullscreen-btn" id="fullscreenBtn">⛶ Fullscreen</button>
      </div>

      <div id="statsBar" style="display:none;"></div>

      <div class="hint">
        Tip: Drag the ring to set time · Space to start/pause · R to reset
      </div>
    </section>
  </main>

  <script>
// ─── All JavaScript inlined so the timer works as a single HTML file ───

// Polyfill for roundRect (not available in all browsers)
if (typeof CanvasRenderingContext2D !== "undefined" && !CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, radii) {
    let r;
    if (typeof radii === "number") {
      r = { tl: radii, tr: radii, br: radii, bl: radii };
    } else if (Array.isArray(radii)) {
      if (radii.length === 4) r = { tl: radii[0], tr: radii[1], br: radii[2], bl: radii[3] };
      else r = { tl: radii[0] || 0, tr: radii[0] || 0, br: radii[0] || 0, bl: radii[0] || 0 };
    } else {
      r = { tl: 0, tr: 0, br: 0, bl: 0 };
    }
    this.moveTo(x + r.tl, y);
    this.lineTo(x + w - r.tr, y);
    this.quadraticCurveTo(x + w, y, x + w, y + r.tr);
    this.lineTo(x + w, y + h - r.br);
    this.quadraticCurveTo(x + w, y + h, x + w - r.br, y + h);
    this.lineTo(x + r.bl, y + h);
    this.quadraticCurveTo(x, y + h, x, y + h - r.bl);
    this.lineTo(x, y + r.tl);
    this.quadraticCurveTo(x, y, x + r.tl, y);
    this.closePath();
    return this;
  };
}

const STORAGE_KEY = "kitchen-timer-state";
const CIRCUMFERENCE = 2 * Math.PI * 88;

// DOM elements
const timeDisplay = document.getElementById("timeDisplay");
const minutesInput = document.getElementById("minutesInput");
const startButton = document.getElementById("startButton");
const pauseButton = document.getElementById("pauseButton");
const resetButton = document.getElementById("resetButton");
const notifyToggle = document.getElementById("notifyToggle");
const presetButtons = document.querySelectorAll(".preset");
const ringFill = document.getElementById("ringFill");
const ringHandle = document.getElementById("ringHandle");
const ringContainer = document.getElementById("ringContainer");
const fullscreenBtn = document.getElementById("fullscreenBtn");
const activityInput = document.getElementById("activityInput");
const illustrationContainer = document.getElementById("illustrationContainer");
const illustrationCanvas = document.getElementById("illustrationCanvas");
const activityPresetBtns = document.querySelectorAll(".activity-preset");
const soundThemeBtns = document.querySelectorAll(".sound-theme");
const themeBtns = document.querySelectorAll(".theme-btn");

let audioContext;
let tickInterval;
let illustrationAnimFrame;

const defaultState = {
  mode: "idle",
  status: "stopped",
  remainingSeconds: 0,
  totalSeconds: 0,
  stopwatchElapsedSeconds: 0,
  countdownEndTimestamp: null,
  stopwatchStartTimestamp: null,
  notify: false,
  soundTheme: "chime",
  visualTheme: "dark",
  activity: "",
};

const state = Object.assign({}, defaultState);

// ─── Helper: resolve CSS variable to actual color ────────
const getAccentColor = () => {
  return getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#6ee7b7";
};

const getBgColor = () => {
  return getComputedStyle(document.documentElement).getPropertyValue("--bg").trim() || "#0a0a0f";
};

// ─── Formatting ──────────────────────────────────────────
const formatTime = (totalSeconds) => {
  const hrs = Math.floor(totalSeconds / 3600);
  const mins = Math.floor((totalSeconds % 3600) / 60);
  const secs = Math.floor(totalSeconds % 60);
  if (hrs > 0) {
    return `${String(hrs).padStart(2, "0")}:${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
  }
  return `${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
};

// ─── State persistence ───────────────────────────────────
const saveState = () => localStorage.setItem(STORAGE_KEY, JSON.stringify(state));

const loadState = () => {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (!saved) return;
  try {
    const parsed = JSON.parse(saved);
    for (const key of Object.keys(defaultState)) {
      if (key in parsed) {
        state[key] = parsed[key];
      }
    }
  } catch {
    localStorage.removeItem(STORAGE_KEY);
  }
};

// ─── Display updates ─────────────────────────────────────
const updateDisplay = (seconds) => {
  timeDisplay.textContent = formatTime(seconds);
};

const updateButtons = () => {
  startButton.disabled = state.status === "running";
  pauseButton.textContent = state.status === "paused" ? "Resume" : "Pause";
};

const updateRing = (progress) => {
  const offset = CIRCUMFERENCE * (1 - Math.max(0, Math.min(1, progress)));
  ringFill.setAttribute("stroke-dashoffset", offset);

  const angle = progress * 2 * Math.PI;
  const hx = 100 + 88 * Math.cos(angle - Math.PI / 2);
  const hy = 100 + 88 * Math.sin(angle - Math.PI / 2);
  ringHandle.setAttribute("cx", hx);
  ringHandle.setAttribute("cy", hy);
};

// ─── Background (theme-only, no countdown color shifts) ──

const resetBackground = () => {
  document.body.style.background = "";
};

// ─── Pulse animation ─────────────────────────────────────
const updatePulse = (remaining) => {
  if (state.mode === "countdown" && state.status === "running" && remaining <= 10 && remaining > 0) {
    timeDisplay.classList.add("pulse");
  } else {
    timeDisplay.classList.remove("pulse");
  }
};

// ─── Time calculations ───────────────────────────────────
const calculateRemainingSeconds = () => {
  if (!state.countdownEndTimestamp) return state.remainingSeconds;
  const diff = state.countdownEndTimestamp - Date.now();
  return Math.max(0, Math.floor((diff + 999) / 1000));
};

const calculateStopwatchElapsed = () => {
  if (!state.stopwatchStartTimestamp) return state.stopwatchElapsedSeconds;
  const diff = Date.now() - state.stopwatchStartTimestamp;
  return Math.max(0, Math.floor(diff / 1000));
};

// ─── Audio ───────────────────────────────────────────────
const warmAudio = () => {
  if (!audioContext) {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioContext.state === "suspended") audioContext.resume();
};

const playSound = (theme) => {
  if (!audioContext) warmAudio();
  if (!audioContext) return;

  const t = audioContext.currentTime;

  if (theme === "chime") {
    [880, 1320].forEach((freq, i) => {
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, t);
      gain.gain.setValueAtTime(0.001, t);
      gain.gain.exponentialRampToValueAtTime(0.3 - i * 0.1, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 1.5);
      osc.connect(gain).connect(audioContext.destination);
      osc.start(t + i * 0.15);
      osc.stop(t + 1.5);
    });
  } else if (theme === "bell") {
    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(440, t);
    osc.frequency.exponentialRampToValueAtTime(220, t + 2);
    gain.gain.setValueAtTime(0.001, t);
    gain.gain.exponentialRampToValueAtTime(0.5, t + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 2.5);
    osc.connect(gain).connect(audioContext.destination);
    osc.start(t);
    osc.stop(t + 2.5);
  } else if (theme === "gong") {
    [130, 260, 390].forEach((freq, i) => {
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      osc.type = i === 0 ? "sine" : "triangle";
      osc.frequency.setValueAtTime(freq, t);
      gain.gain.setValueAtTime(0.001, t);
      gain.gain.exponentialRampToValueAtTime(0.35 / (i + 1), t + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 3);
      osc.connect(gain).connect(audioContext.destination);
      osc.start(t);
      osc.stop(t + 3);
    });
  } else if (theme === "arcade") {
    const notes = [523, 659, 784, 1047];
    notes.forEach((freq, i) => {
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      osc.type = "square";
      osc.frequency.setValueAtTime(freq, t + i * 0.12);
      gain.gain.setValueAtTime(0.001, t + i * 0.12);
      gain.gain.linearRampToValueAtTime(0.15, t + i * 0.12 + 0.01);
      gain.gain.linearRampToValueAtTime(0.0001, t + i * 0.12 + 0.2);
      osc.connect(gain).connect(audioContext.destination);
      osc.start(t + i * 0.12);
      osc.stop(t + i * 0.12 + 0.25);
    });
  }
};

// ─── Confetti ────────────────────────────────────────────
const launchConfetti = () => {
  const container = document.createElement("div");
  container.className = "confetti-container";
  document.body.appendChild(container);

  const colors = ["#ff6b6b", "#ffd93d", "#6ee7b7", "#74b9ff", "#a29bfe", "#fd79a8", "#fdcb6e", "#00cec9"];

  for (let i = 0; i < 60; i++) {
    const piece = document.createElement("div");
    piece.className = "confetti-piece";
    piece.style.left = Math.random() * 100 + "%";
    piece.style.animationDelay = Math.random() * 0.8 + "s";
    piece.style.animationDuration = (2 + Math.random() * 2) + "s";
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.borderRadius = Math.random() > 0.5 ? "50%" : "2px";
    piece.style.width = (6 + Math.random() * 8) + "px";
    piece.style.height = (6 + Math.random() * 8) + "px";
    container.appendChild(piece);
  }

  setTimeout(() => container.remove(), 4000);
};

const showTimesUp = () => {
  const banner = document.createElement("div");
  banner.className = "times-up";
  const activity = state.activity.trim();
  banner.textContent = activity ? `${activity} done!` : "Time's up!";
  document.body.appendChild(banner);
  setTimeout(() => banner.remove(), 2500);
};

// ─── Alert ───────────────────────────────────────────────
const triggerAlert = () => {
  playSound(state.soundTheme);
  launchConfetti();
  showTimesUp();
  if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 200]);

  if (state.notify && "Notification" in window) {
    const activity = state.activity.trim();
    const body = activity ? `${activity} is done! Stopwatch started.` : "Countdown finished. Stopwatch started.";
    if (Notification.permission === "granted") {
      new Notification("Timer done", { body });
    } else if (Notification.permission === "default") {
      Notification.requestPermission().then((permission) => {
        if (permission === "granted") {
          new Notification("Timer done", { body });
        }
      });
    }
  }
};

// ─── Timer transitions ──────────────────────────────────
const transitionToStopwatch = () => {
  triggerAlert();
  recordCompletion();
  hideFunFact();
  const now = Date.now();
  const elapsed = state.countdownEndTimestamp ? Math.max(0, Math.floor((now - state.countdownEndTimestamp) / 1000)) : 0;

  state.mode = "stopwatch";
  state.status = "running";
  state.stopwatchElapsedSeconds = elapsed;
  state.stopwatchStartTimestamp = now - elapsed * 1000;
  state.countdownEndTimestamp = null;

  updateDisplay(state.stopwatchElapsedSeconds);
  updateButtons();
  updateRing(0);
  resetBackground();
  timeDisplay.classList.remove("pulse");
  saveState();
};

const startCountdown = (minutes) => {
  state.mode = "countdown";
  state.status = "running";
  state.remainingSeconds = minutes * 60;
  state.totalSeconds = minutes * 60;
  state.countdownEndTimestamp = Date.now() + state.remainingSeconds * 1000;
  state.stopwatchElapsedSeconds = 0;
  state.stopwatchStartTimestamp = null;

  updateDisplay(state.remainingSeconds);
  updateRing(1);
  ringHandle.style.display = "none";
  updateButtons();

  // Show a fun fact if an activity is set
  if (detectActivity(state.activity)) {
    showFunFact();
    if (funFactInterval) clearInterval(funFactInterval);
    funFactInterval = setInterval(showFunFact, 15000);
  }

  saveState();
};

const startStopwatch = () => {
  state.mode = "stopwatch";
  state.status = "running";
  state.stopwatchStartTimestamp = Date.now() - state.stopwatchElapsedSeconds * 1000;
  updateButtons();
  saveState();
};

// ─── Handlers ────────────────────────────────────────────
const handleStart = () => {
  warmAudio();
  if (state.status === "running") return;

  if (state.mode === "stopwatch") return startStopwatch();

  const minutes = Number.parseInt(minutesInput.value, 10);
  if (Number.isNaN(minutes) || minutes <= 0) return;

  startCountdown(minutes);
};

const handlePauseResume = () => {
  if (state.status === "stopped") return;

  if (state.status === "running") {
    if (state.mode === "countdown") {
      state.remainingSeconds = calculateRemainingSeconds();
      state.countdownEndTimestamp = null;
    } else {
      state.stopwatchElapsedSeconds = calculateStopwatchElapsed();
      state.stopwatchStartTimestamp = null;
    }
    state.status = "paused";
  } else {
    state.status = "running";
    if (state.mode === "countdown") {
      state.countdownEndTimestamp = Date.now() + state.remainingSeconds * 1000;
    } else {
      state.stopwatchStartTimestamp = Date.now() - state.stopwatchElapsedSeconds * 1000;
    }
  }

  updateButtons();
  saveState();
};

const handleReset = () => {
  state.mode = "idle";
  state.status = "stopped";
  state.remainingSeconds = 0;
  state.totalSeconds = 0;
  state.stopwatchElapsedSeconds = 0;
  state.countdownEndTimestamp = null;
  state.stopwatchStartTimestamp = null;

  updateDisplay(0);
  updateButtons();
  updateRing(0);
  resetBackground();
  hideFunFact();
  timeDisplay.classList.remove("pulse");
  ringHandle.style.display = "none";
  saveState();
};

const handleTick = () => {
  if (state.status !== "running") return;

  if (state.mode === "countdown") {
    const remaining = calculateRemainingSeconds();
    state.remainingSeconds = remaining;
    updateDisplay(remaining);

    const progress = state.totalSeconds > 0 ? remaining / state.totalSeconds : 0;
    updateRing(progress);
    updatePulse(remaining);

    if (remaining <= 0) return transitionToStopwatch();
  } else if (state.mode === "stopwatch") {
    const elapsed = calculateStopwatchElapsed();
    state.stopwatchElapsedSeconds = elapsed;
    updateDisplay(elapsed);
  }

  saveState();
};

const applyPreset = (minutes) => {
  minutesInput.value = minutes;
  state.remainingSeconds = minutes * 60;
  state.totalSeconds = minutes * 60;
  state.mode = "countdown";
  state.status = "stopped";
  state.countdownEndTimestamp = null;

  updateDisplay(state.remainingSeconds);
  updateRing(1);
  ringHandle.style.display = "none";
  updateButtons();
  saveState();
};

// ─── Event listeners ─────────────────────────────────────
startButton.addEventListener("click", handleStart);
pauseButton.addEventListener("click", handlePauseResume);
resetButton.addEventListener("click", handleReset);

notifyToggle.addEventListener("change", () => {
  state.notify = notifyToggle.checked;
  if (state.notify && "Notification" in window && Notification.permission === "default") {
    Notification.requestPermission();
  }
  saveState();
});

presetButtons.forEach((button) => {
  button.addEventListener("click", () => applyPreset(Number(button.dataset.minutes)));
});

// ─── Drag-to-set on ring ─────────────────────────────────
let isDragging = false;
const MAX_DRAG_MINUTES = 60;

const getAngleFromEvent = (e) => {
  const rect = ringContainer.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  let angle = Math.atan2(clientY - cy, clientX - cx) + Math.PI / 2;
  if (angle < 0) angle += 2 * Math.PI;
  return angle;
};

const setTimeFromAngle = (angle) => {
  const fraction = angle / (2 * Math.PI);
  const minutes = Math.max(1, Math.round(fraction * MAX_DRAG_MINUTES));
  minutesInput.value = minutes;
  state.remainingSeconds = minutes * 60;
  state.totalSeconds = minutes * 60;
  state.mode = "countdown";
  state.status = "stopped";
  state.countdownEndTimestamp = null;

  updateDisplay(state.remainingSeconds);
  updateRing(1);

  const hx = 100 + 88 * Math.cos(angle - Math.PI / 2);
  const hy = 100 + 88 * Math.sin(angle - Math.PI / 2);
  ringHandle.setAttribute("cx", hx);
  ringHandle.setAttribute("cy", hy);
  ringHandle.style.display = "";

  updateButtons();
};

const onDragStart = (e) => {
  if (state.status === "running") return;
  isDragging = true;
  ringHandle.style.display = "";
  const angle = getAngleFromEvent(e);
  setTimeFromAngle(angle);
  e.preventDefault();
};

const onDragMove = (e) => {
  if (!isDragging) return;
  const angle = getAngleFromEvent(e);
  setTimeFromAngle(angle);
  e.preventDefault();
};

const onDragEnd = () => {
  if (!isDragging) return;
  isDragging = false;
  saveState();
};

ringContainer.addEventListener("mousedown", onDragStart);
ringContainer.addEventListener("touchstart", onDragStart, { passive: false });
document.addEventListener("mousemove", onDragMove);
document.addEventListener("touchmove", onDragMove, { passive: false });
document.addEventListener("mouseup", onDragEnd);
document.addEventListener("touchend", onDragEnd);

// ─── Keyboard shortcuts ──────────────────────────────────
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;

  if (e.code === "Space") {
    e.preventDefault();
    if (state.status === "running" || state.status === "paused") {
      handlePauseResume();
    } else {
      handleStart();
    }
  } else if (e.code === "KeyR" && !e.ctrlKey && !e.metaKey) {
    e.preventDefault();
    handleReset();
  } else if (e.code === "KeyF" && !e.ctrlKey && !e.metaKey) {
    e.preventDefault();
    toggleFullscreen();
  } else if (e.key >= "1" && e.key <= "9" && !e.ctrlKey && !e.metaKey) {
    const presetMap = { "1": 1, "2": 5, "3": 10, "4": 15, "5": 20, "6": 30 };
    const minutes = presetMap[e.key];
    if (minutes && state.status !== "running") {
      e.preventDefault();
      applyPreset(minutes);
    }
  }
});

// ─── Fullscreen ──────────────────────────────────────────
const toggleFullscreen = () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen().catch(() => {});
  }
};

fullscreenBtn.addEventListener("click", toggleFullscreen);

// ─── Sound themes ────────────────────────────────────────
soundThemeBtns.forEach((btn) => {
  btn.addEventListener("click", () => {
    soundThemeBtns.forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
    state.soundTheme = btn.dataset.sound;

    playSound(state.soundTheme);
    saveState();
  });
});

// ─── Visual themes ───────────────────────────────────────
const applyTheme = (theme) => {
  document.body.className = "";
  if (theme !== "dark") {
    document.body.classList.add("theme-" + theme);
  }
  resetBackground();
};

themeBtns.forEach((btn) => {
  btn.addEventListener("click", () => {
    themeBtns.forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
    state.visualTheme = btn.dataset.theme;
    applyTheme(state.visualTheme);
    saveState();
  });
});

// ─── Activity & Illustrations ────────────────────────────
const ctx = illustrationCanvas ? illustrationCanvas.getContext("2d") : null;
const funFactEl = document.getElementById("funFact");
const statsBarEl = document.getElementById("statsBar");

const knownActivities = {
  pizza: true, laundry: true, eggs: true, tea: true, workout: true, nap: true, quiche: true,
};

const detectActivity = (text) => {
  const lower = text.toLowerCase().trim();
  for (const key of Object.keys(knownActivities)) {
    if (lower.includes(key)) return key;
  }
  if (lower.includes("cook") || lower.includes("bak") || lower.includes("oven") || lower.includes("roast")) return "pizza";
  if (lower.includes("wash") || lower.includes("cloth") || lower.includes("dryer") || lower.includes("spin")) return "laundry";
  if (lower.includes("boil") || lower.includes("egg")) return "eggs";
  if (lower.includes("coffee") || lower.includes("brew") || lower.includes("steep")) return "tea";
  if (lower.includes("exercise") || lower.includes("run") || lower.includes("plank") || lower.includes("gym")) return "workout";
  if (lower.includes("sleep") || lower.includes("rest") || lower.includes("break")) return "nap";
  if (lower.includes("pastry") || lower.includes("tart") || lower.includes("pie") || lower.includes("souffle")) return "quiche";
  return null;
};

const updateActivity = () => {
  const text = activityInput.value.trim();
  state.activity = text;
  const detected = detectActivity(text);

  if (detected && illustrationContainer) {
    illustrationContainer.style.display = "";
    startIllustration(detected);
  } else if (illustrationContainer) {
    illustrationContainer.style.display = "none";
    stopIllustration();
  }
  saveState();
};

activityInput.addEventListener("input", updateActivity);

activityPresetBtns.forEach((btn) => {
  btn.addEventListener("click", () => {
    const activity = btn.dataset.activity;
    activityInput.value = activity.charAt(0).toUpperCase() + activity.slice(1);
    updateActivity();
  });
});

// ─── Canvas Illustrations ────────────────────────────────
let currentIllustration = null;
let illustrationStartTime = 0;

const stopIllustration = () => {
  currentIllustration = null;
  if (illustrationAnimFrame) {
    cancelAnimationFrame(illustrationAnimFrame);
    illustrationAnimFrame = null;
  }
};

const startIllustration = (type) => {
  currentIllustration = type;
  illustrationStartTime = Date.now();
  if (!illustrationAnimFrame) {
    drawIllustration();
  }
};

const getTimerProgress = () => {
  if (state.mode === "countdown" && state.totalSeconds > 0) {
    return 1 - (state.remainingSeconds / state.totalSeconds);
  }
  return 0;
};

const drawIllustration = () => {
  if (!ctx || !currentIllustration) return;

  try {
    const W = 180, H = 180;
    ctx.clearRect(0, 0, W, H);

    const progress = getTimerProgress();
    const t = (Date.now() - illustrationStartTime) / 1000;

    switch (currentIllustration) {
      case "pizza": drawPizza(progress, t); break;
      case "laundry": drawLaundry(progress, t); break;
      case "eggs": drawEggs(progress, t); break;
      case "tea": drawTea(progress, t); break;
      case "workout": drawWorkout(progress, t); break;
      case "nap": drawNap(progress, t); break;
      case "quiche": drawQuiche(progress, t); break;
    }
  } catch (e) {
    // Don't let illustration errors break the app
  }

  illustrationAnimFrame = requestAnimationFrame(drawIllustration);
};

// ─── Cute drawing helpers ────────────────────────────────
const OL = 2.5; // outline width for cute style
const outline = (color) => { ctx.strokeStyle = color || "#2d1b0e"; ctx.lineWidth = OL; ctx.stroke(); };
const drawCuteEyes = (cx, cy, open) => {
  ctx.fillStyle = "#2d1b0e";
  if (open) {
    // round eyes with highlight
    ctx.beginPath(); ctx.arc(cx - 6, cy, 3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 6, cy, 3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(cx - 5, cy - 1, 1.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 7, cy - 1, 1.2, 0, Math.PI * 2); ctx.fill();
  } else {
    // happy closed eyes (arcs)
    ctx.strokeStyle = "#2d1b0e"; ctx.lineWidth = 2; ctx.lineCap = "round";
    ctx.beginPath(); ctx.arc(cx - 6, cy, 3, Math.PI, 0); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx + 6, cy, 3, Math.PI, 0); ctx.stroke();
  }
};
const drawSmile = (cx, cy, w) => {
  ctx.strokeStyle = "#2d1b0e"; ctx.lineWidth = 2; ctx.lineCap = "round";
  ctx.beginPath(); ctx.arc(cx, cy - 2, w || 4, 0.15, Math.PI - 0.15); ctx.stroke();
};
const drawBlush = (cx, cy) => {
  ctx.fillStyle = "rgba(255,130,130,0.35)";
  ctx.beginPath(); ctx.ellipse(cx - 12, cy + 3, 5, 3, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + 12, cy + 3, 5, 3, 0, 0, Math.PI * 2); ctx.fill();
};
const drawSteam = (cx, topY, count, t, alpha) => {
  ctx.strokeStyle = `rgba(255,255,255,${alpha || 0.45})`; ctx.lineWidth = 2; ctx.lineCap = "round";
  for (let i = 0; i < (count || 3); i++) {
    const sx = cx - (count - 1) * 7 + i * 14;
    const sw = Math.sin(t * 2 + i * 1.3) * 5;
    ctx.beginPath(); ctx.moveTo(sx, topY);
    ctx.quadraticCurveTo(sx + sw, topY - 14, sx - sw * 0.5, topY - 28);
    ctx.stroke();
  }
};

// --- Pizza illustration (cute floating slice) ---
const drawPizza = (progress, t) => {
  const cx = 90, cy = 90;
  const bob = Math.sin(t * 2) * 4;
  const tilt = Math.sin(t * 1.5) * 0.06;
  ctx.save(); ctx.translate(cx, cy + bob); ctx.rotate(tilt);

  // Shadow
  ctx.fillStyle = "rgba(0,0,0,0.1)";
  ctx.beginPath(); ctx.ellipse(0, 52 - bob, 38, 8, 0, 0, Math.PI * 2); ctx.fill();

  // Crust (triangle slice)
  ctx.fillStyle = "#e8a84c";
  ctx.beginPath(); ctx.moveTo(0, -48); ctx.lineTo(-40, 35); ctx.lineTo(40, 35);
  ctx.closePath(); ctx.fill(); outline();

  // Sauce
  ctx.fillStyle = "#d94030";
  ctx.beginPath(); ctx.moveTo(0, -36); ctx.lineTo(-30, 28); ctx.lineTo(30, 28);
  ctx.closePath(); ctx.fill();

  // Cheese (melty, gets more golden with progress)
  const cg = Math.round(210 - progress * 40);
  ctx.fillStyle = `rgb(255,${cg},60)`;
  ctx.beginPath(); ctx.moveTo(0, -32); ctx.lineTo(-26, 24); ctx.lineTo(26, 24);
  ctx.closePath(); ctx.fill();

  // Cheese drips
  ctx.fillStyle = `rgb(255,${cg},60)`;
  ctx.beginPath(); ctx.moveTo(-26, 24); ctx.quadraticCurveTo(-30, 34 + Math.sin(t) * 3, -24, 28); ctx.fill();
  ctx.beginPath(); ctx.moveTo(26, 24); ctx.quadraticCurveTo(32, 36 + Math.sin(t + 1) * 3, 24, 28); ctx.fill();

  // Crust edge
  ctx.fillStyle = "#c87830";
  ctx.beginPath(); ctx.moveTo(-40, 35); ctx.quadraticCurveTo(0, 46, 40, 35); ctx.lineTo(36, 30);
  ctx.quadraticCurveTo(0, 40, -36, 30); ctx.closePath(); ctx.fill(); outline();

  // Pepperoni
  const pepPos = [[-10, -8], [10, 2], [-2, 14], [14, -16], [-16, 6]];
  pepPos.forEach(([px, py]) => {
    ctx.fillStyle = "#b82020"; ctx.beginPath(); ctx.arc(px, py, 6, 0, Math.PI * 2); ctx.fill(); outline();
    ctx.fillStyle = "#d03030"; ctx.beginPath(); ctx.arc(px - 1, py - 1, 3.5, 0, Math.PI * 2); ctx.fill();
  });

  // Cute face
  drawCuteEyes(0, 0, true);
  drawSmile(0, 6);
  drawBlush(0, 4);

  // Steam when cooking
  if (progress > 0.2) {
    ctx.restore(); // restore before drawing steam in world coords
    drawSteam(cx, cy + bob - 52, 3, t, Math.min((progress - 0.2) * 0.7, 0.5));
    return;
  }
  ctx.restore();
};

// --- Laundry illustration (cute washer) ---
const drawLaundry = (progress, t) => {
  const cx = 90, cy = 88;

  // Shadow
  ctx.fillStyle = "rgba(0,0,0,0.08)";
  ctx.beginPath(); ctx.ellipse(cx, 168, 50, 6, 0, 0, Math.PI * 2); ctx.fill();

  // Body
  ctx.fillStyle = "#e8eaee"; ctx.beginPath(); ctx.roundRect(30, 22, 120, 140, 14); ctx.fill(); outline();

  // Top panel
  ctx.fillStyle = "#d0d3d8"; ctx.beginPath(); ctx.roundRect(30, 22, 120, 32, [14, 14, 0, 0]); ctx.fill(); outline();

  // Knob
  ctx.fillStyle = "#888"; ctx.beginPath(); ctx.arc(55, 38, 8, 0, Math.PI * 2); ctx.fill(); outline();
  ctx.fillStyle = "#bbb"; ctx.beginPath(); ctx.arc(55, 38, 4, 0, Math.PI * 2); ctx.fill();

  // Status light
  ctx.fillStyle = state.status === "running" ? "#4ade80" : "#aaa";
  ctx.beginPath(); ctx.arc(125, 38, 4, 0, Math.PI * 2); ctx.fill(); outline();

  // Door circle
  ctx.fillStyle = "#3a6090"; ctx.beginPath(); ctx.arc(cx, cy + 18, 42, 0, Math.PI * 2); ctx.fill();
  outline();

  // Water & clothes inside
  ctx.save(); ctx.beginPath(); ctx.arc(cx, cy + 18, 39, 0, Math.PI * 2); ctx.clip();
  const wl = cy + 30 - progress * 8;
  ctx.fillStyle = "rgba(100,190,255,0.35)"; ctx.beginPath(); ctx.moveTo(40, wl);
  for (let x = 40; x <= 140; x += 2) ctx.lineTo(x, wl + Math.sin((x - cx) * 0.12 + t * 4) * 3);
  ctx.lineTo(140, 170); ctx.lineTo(40, 170); ctx.closePath(); ctx.fill();

  const sp = state.status === "running" ? 3 + progress * 4 : 0;
  ["#e74c3c","#3498db","#2ecc71","#f39c12"].forEach((c, i) => {
    const a = (i / 4) * Math.PI * 2 + t * sp;
    const d = 20 + Math.sin(t * 2 + i) * 4;
    ctx.fillStyle = c; ctx.beginPath();
    ctx.ellipse(cx + Math.cos(a) * d, cy + 18 + Math.sin(a) * d, 8, 6, a, 0, Math.PI * 2);
    ctx.fill(); outline();
  });
  ctx.restore();

  // Glass shine
  ctx.strokeStyle = "rgba(255,255,255,0.3)"; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(cx - 14, cy + 8, 22, -0.9, 0.2); ctx.stroke();

  // Cute face on the door
  drawCuteEyes(cx, cy + 12, state.status === "running");
  drawSmile(cx, cy + 18);

  // Suds
  if (progress > 0.1) {
    ctx.fillStyle = "rgba(255,255,255,0.5)";
    for (let i = 0; i < 4; i++) {
      ctx.beginPath();
      ctx.arc(cx - 15 + i * 10 + Math.sin(t + i) * 2, wl - 4, 4 + Math.sin(t * 2 + i) * 1.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }
};

// --- Eggs illustration (cute egg in pot) ---
const drawEggs = (progress, t) => {
  const cx = 90, cy = 95;

  // Pot body
  ctx.fillStyle = "#e85050"; ctx.beginPath(); ctx.roundRect(28, 65, 124, 80, [0, 0, 16, 16]); ctx.fill(); outline();

  // Pot rim
  ctx.fillStyle = "#cc3838"; ctx.beginPath(); ctx.roundRect(22, 58, 136, 16, 8); ctx.fill(); outline();

  // Water
  ctx.fillStyle = "rgba(130,210,255,0.55)"; ctx.beginPath();
  ctx.roundRect(32, 70, 116, 70, [0, 0, 14, 14]); ctx.fill();

  // Bubbles
  const bc = Math.floor(3 + progress * 10);
  for (let i = 0; i < bc; i++) {
    const bx = 48 + (i * 29) % 80;
    const by = 100 + Math.sin(t * 3 + i * 1.7) * 10 - (t * 25 + i * 30) % 45;
    ctx.fillStyle = `rgba(255,255,255,${0.3 + Math.sin(t + i) * 0.2})`;
    ctx.beginPath(); ctx.arc(bx, Math.max(by, 75), 3, 0, Math.PI * 2); ctx.fill();
  }

  // Cute egg
  const bob = Math.sin(t * 2) * 3;
  ctx.fillStyle = "#fff8ee"; ctx.beginPath(); ctx.ellipse(cx, 100 + bob, 18, 22, 0, 0, Math.PI * 2); ctx.fill(); outline();
  drawCuteEyes(cx, 96 + bob, progress < 0.8);
  if (progress >= 0.8) drawSmile(cx, 103 + bob); // happy when done
  else { // little "o" mouth (surprised by hot water)
    ctx.fillStyle = "#2d1b0e"; ctx.beginPath(); ctx.arc(cx, 104 + bob, 2.5, 0, Math.PI * 2); ctx.fill();
  }
  drawBlush(cx, 100 + bob);

  // Handles
  ctx.fillStyle = "#555"; ctx.beginPath(); ctx.roundRect(12, 85, 18, 10, 5); ctx.fill(); outline();
  ctx.beginPath(); ctx.roundRect(150, 85, 18, 10, 5); ctx.fill(); outline();

  // Steam
  if (progress > 0.15) drawSteam(cx, 55, 4, t, Math.min((progress - 0.15) * 0.6, 0.45));
};

// --- Tea illustration (cute mug) ---
const drawTea = (progress, t) => {
  const cx = 85, cy = 100;
  const bob = Math.sin(t * 1.5) * 2;

  // Saucer
  ctx.fillStyle = "#e8e0d0"; ctx.beginPath(); ctx.ellipse(cx, cy + 42, 48, 10, 0, 0, Math.PI * 2); ctx.fill(); outline();

  // Mug body
  ctx.fillStyle = "#f5f0e8"; ctx.beginPath();
  ctx.moveTo(cx - 32, cy - 18); ctx.lineTo(cx - 28, cy + 35); ctx.quadraticCurveTo(cx, cy + 42, cx + 28, cy + 35);
  ctx.lineTo(cx + 32, cy - 18); ctx.closePath(); ctx.fill(); outline();

  // Handle
  ctx.strokeStyle = "#e0d8c8"; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.arc(cx + 38, cy + 10, 14, -Math.PI / 2, Math.PI / 2); ctx.stroke();
  ctx.strokeStyle = "#2d1b0e"; ctx.lineWidth = OL;
  ctx.beginPath(); ctx.arc(cx + 38, cy + 10, 14, -Math.PI / 2, Math.PI / 2); ctx.stroke();

  // Tea liquid (darkens with steeping)
  const tR = 210 - Math.floor(progress * 90), tG = 170 - Math.floor(progress * 80);
  ctx.fillStyle = `rgb(${tR},${tG},${Math.max(30, 80 - progress * 40)})`;
  ctx.beginPath(); ctx.moveTo(cx - 30, cy - 12); ctx.lineTo(cx - 28, cy + 33);
  ctx.quadraticCurveTo(cx, cy + 40, cx + 28, cy + 33); ctx.lineTo(cx + 30, cy - 12); ctx.closePath(); ctx.fill();

  // Tea bag
  ctx.strokeStyle = "#b8a080"; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(cx - 4, cy - 18); ctx.quadraticCurveTo(cx - 12, cy - 28, cx - 20, cy - 26); ctx.stroke();
  ctx.fillStyle = "#d4c4a8"; ctx.fillRect(cx - 26, cy - 32, 12, 10); outline();

  const bagY = cy + bob;
  ctx.fillStyle = "#c4a878"; ctx.beginPath(); ctx.roundRect(cx - 10, bagY, 12, 18, 3); ctx.fill(); outline();

  // Cute face on mug
  drawCuteEyes(cx, cy + 6, true);
  drawSmile(cx, cy + 12);
  drawBlush(cx, cy + 10);

  // Steam
  drawSteam(cx, cy - 22, 3, t, 0.3 + progress * 0.2);
};

// --- Workout illustration (cute character) ---
const drawWorkout = (progress, t) => {
  const cx = 90, cy = 85;
  const bounce = Math.sin(t * 4) * 4;
  const armL = Math.sin(t * 3) * 22;
  const armR = Math.sin(t * 3 + Math.PI) * 22;

  // Floor
  ctx.fillStyle = "rgba(255,255,255,0.06)"; ctx.fillRect(15, 150, 150, 3);

  // Shadow
  ctx.fillStyle = "rgba(0,0,0,0.08)";
  ctx.beginPath(); ctx.ellipse(cx, 155, 28, 5, 0, 0, Math.PI * 2); ctx.fill();

  // Body (rounded)
  ctx.fillStyle = "#ff9466";
  ctx.beginPath(); ctx.roundRect(cx - 16, cy + 10 + bounce * 0.3, 32, 36, 12); ctx.fill(); outline();

  // Legs
  ctx.fillStyle = "#ff9466"; ctx.lineWidth = OL; ctx.strokeStyle = "#2d1b0e";
  ctx.beginPath(); ctx.roundRect(cx - 14, cy + 42 + bounce * 0.2, 10, 24, 5); ctx.fill(); outline();
  ctx.beginPath(); ctx.roundRect(cx + 4, cy + 42 + bounce * 0.2, 10, 24, 5); ctx.fill(); outline();

  // Shoes
  ctx.fillStyle = "#4488ff";
  ctx.beginPath(); ctx.roundRect(cx - 16, cy + 62 + bounce * 0.2, 14, 8, 4); ctx.fill(); outline();
  ctx.beginPath(); ctx.roundRect(cx + 2, cy + 62 + bounce * 0.2, 14, 8, 4); ctx.fill(); outline();

  // Arms
  ctx.strokeStyle = "#ff9466"; ctx.lineWidth = 7; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(cx - 16, cy + 18 + bounce * 0.3); ctx.lineTo(cx - 30, cy + 18 + armL); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + 16, cy + 18 + bounce * 0.3); ctx.lineTo(cx + 30, cy + 18 + armR); ctx.stroke();
  ctx.strokeStyle = "#2d1b0e"; ctx.lineWidth = OL;
  ctx.beginPath(); ctx.moveTo(cx - 16, cy + 18 + bounce * 0.3); ctx.lineTo(cx - 30, cy + 18 + armL); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + 16, cy + 18 + bounce * 0.3); ctx.lineTo(cx + 30, cy + 18 + armR); ctx.stroke();

  // Dumbbells
  ctx.fillStyle = "#555";
  ctx.beginPath(); ctx.roundRect(cx - 38, cy + 14 + armL, 16, 6, 3); ctx.fill(); outline();
  ctx.beginPath(); ctx.roundRect(cx + 22, cy + 14 + armR, 16, 6, 3); ctx.fill(); outline();

  // Head
  ctx.fillStyle = "#ff9466"; ctx.beginPath(); ctx.arc(cx, cy + bounce * 0.3, 18, 0, Math.PI * 2); ctx.fill(); outline();

  // Headband
  ctx.fillStyle = "#ff4466"; ctx.beginPath();
  ctx.arc(cx, cy + bounce * 0.3, 18, -2.7, -0.45); ctx.lineTo(cx + 16, cy - 8 + bounce * 0.3);
  ctx.arc(cx, cy + bounce * 0.3, 15, -0.45, -2.7, true); ctx.closePath(); ctx.fill();

  // Face
  drawCuteEyes(cx, cy - 2 + bounce * 0.3, true);
  drawSmile(cx, cy + 5 + bounce * 0.3);
  drawBlush(cx, cy + 2 + bounce * 0.3);

  // Sweat drops
  const sc = Math.floor(progress * 5);
  for (let i = 0; i < sc; i++) {
    const sx = cx + (i % 2 === 0 ? -1 : 1) * (22 + i * 3);
    const sy = cy - 10 - ((t * 25 + i * 12) % 25) + bounce * 0.3;
    const a = 1 - ((t * 25 + i * 12) % 25) / 25;
    ctx.fillStyle = `rgba(100,190,255,${a * 0.7})`;
    ctx.beginPath(); ctx.arc(sx, sy, 2.5, 0, Math.PI * 2); ctx.fill();
  }

  // Progress bar
  ctx.fillStyle = "rgba(255,255,255,0.1)"; ctx.beginPath(); ctx.roundRect(30, 162, 120, 8, 4); ctx.fill();
  ctx.fillStyle = getAccentColor(); ctx.beginPath(); ctx.roundRect(30, 162, Math.max(0, 120 * progress), 8, 4); ctx.fill();
};

// --- Nap illustration (cute sleeping face) ---
const drawNap = (progress, t) => {
  const cx = 90, cy = 100;
  const accent = getAccentColor();
  const bg = getBgColor();

  // Stars
  const stars = [[30, 18], [55, 10], [130, 20], [45, 35], [115, 30], [150, 40]];
  stars.forEach(([sx, sy], i) => {
    const tw = 0.4 + Math.sin(t * 2 + i * 1.5) * 0.4;
    ctx.fillStyle = `rgba(255,255,200,${tw})`;
    ctx.beginPath(); ctx.arc(sx, sy, 2, 0, Math.PI * 2); ctx.fill();
  });

  // Moon
  ctx.fillStyle = "#ffd700"; ctx.beginPath(); ctx.arc(148, 22, 14, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(153, 18, 12, 0, Math.PI * 2); ctx.fill();

  // Pillow
  ctx.fillStyle = "#f0e8d8"; ctx.beginPath(); ctx.ellipse(cx, cy + 14, 52, 16, 0, 0, Math.PI * 2); ctx.fill(); outline("#c8b898");

  // Blanket
  const bGrad = ctx.createLinearGradient(40, cy + 5, 140, cy + 45);
  bGrad.addColorStop(0, "#7ea0d0"); bGrad.addColorStop(1, "#5a80b5");
  ctx.fillStyle = bGrad; ctx.beginPath(); ctx.moveTo(40, cy + 5);
  for (let x = 40; x <= 140; x += 2) ctx.lineTo(x, cy + 5 + Math.sin((x - cx) * 0.08) * 3);
  ctx.lineTo(140, cy + 40); ctx.quadraticCurveTo(cx, cy + 48, 40, cy + 40); ctx.closePath(); ctx.fill(); outline("#4a6a90");

  // Head
  ctx.fillStyle = "#f5d0b0"; ctx.beginPath(); ctx.arc(cx, cy - 5, 22, 0, Math.PI * 2); ctx.fill(); outline();

  // Closed eyes
  ctx.strokeStyle = "#8b6b50"; ctx.lineWidth = 2; ctx.lineCap = "round";
  ctx.beginPath(); ctx.arc(cx - 8, cy - 7, 4, 0, Math.PI); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx + 8, cy - 7, 4, 0, Math.PI); ctx.stroke();

  // Smile
  drawSmile(cx, cy + 2, 5);
  drawBlush(cx, cy - 2);

  // Breathing blanket
  const br = Math.sin(t * 1.5) * 2;
  ctx.fillStyle = "#7ea0d0"; ctx.beginPath();
  ctx.ellipse(cx, cy + 20 + br, 30, 8 + br, 0, 0, Math.PI * 2); ctx.fill();

  // Z's
  ctx.font = "bold 16px system-ui"; ctx.fillStyle = accent;
  for (let i = 0; i < 3; i++) {
    const zx = cx + 28 + i * 10 + Math.sin(t + i) * 3;
    const zy = cy - 18 - i * 16 - ((t * 15) % 20);
    ctx.globalAlpha = 0.7 - i * 0.2; ctx.fillText("z", zx, zy);
  }
  ctx.globalAlpha = 1;
};

// --- Quiche illustration (cute quiche in pie dish) ---
const drawQuiche = (progress, t) => {
  const cx = 90, cy = 100;
  const bob = Math.sin(t * 1.8) * 2;

  // Shadow
  ctx.fillStyle = "rgba(0,0,0,0.08)";
  ctx.beginPath(); ctx.ellipse(cx, cy + 50, 50, 8, 0, 0, Math.PI * 2); ctx.fill();

  // Pie dish (scalloped edges)
  ctx.fillStyle = "#e8ddd0"; ctx.beginPath();
  ctx.ellipse(cx, cy + 20 + bob, 58, 20, 0, 0, Math.PI * 2); ctx.fill(); outline("#b8a888");

  // Dish body
  ctx.fillStyle = "#f0e8d8"; ctx.beginPath();
  ctx.moveTo(cx - 55, cy + 20 + bob); ctx.quadraticCurveTo(cx - 50, cy + 45 + bob, cx, cy + 48 + bob);
  ctx.quadraticCurveTo(cx + 50, cy + 45 + bob, cx + 55, cy + 20 + bob); ctx.closePath();
  ctx.fill(); outline("#b8a888");

  // Scalloped crust edge
  for (let i = 0; i < 16; i++) {
    const angle = (i / 16) * Math.PI * 2;
    const sx = cx + Math.cos(angle) * 54;
    const sy = cy + 20 + bob + Math.sin(angle) * 18;
    ctx.fillStyle = "#dab870"; ctx.beginPath(); ctx.arc(sx, sy, 5, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = "#dab870"; ctx.beginPath();
  ctx.ellipse(cx, cy + 20 + bob, 52, 16, 0, 0, Math.PI * 2); ctx.fill(); outline("#a08040");

  // Quiche filling (golden yellow, darkens as it cooks)
  const fR = 255 - Math.floor(progress * 30);
  const fG = Math.max(140, 210 - Math.floor(progress * 50));
  ctx.fillStyle = `rgb(${fR},${fG},60)`; ctx.beginPath();
  ctx.ellipse(cx, cy + 20 + bob, 46, 12, 0, 0, Math.PI * 2); ctx.fill();

  // Filling texture - little veggie bits
  const bits = [[- 15, -2, "#5a8040"], [10, 1, "#c85040"], [-5, -4, "#5a8040"], [20, -1, "#e8a040"],
    [-22, 0, "#c85040"], [8, -3, "#5a8040"], [25, 2, "#e8a040"], [-10, 3, "#c85040"]];
  bits.forEach(([ox, oy, c]) => {
    ctx.fillStyle = c; ctx.beginPath();
    ctx.arc(cx + ox, cy + 19 + bob + oy, 3, 0, Math.PI * 2); ctx.fill();
  });

  // Golden brown spots (more as it cooks)
  const spotCount = Math.floor(progress * 6);
  for (let i = 0; i < spotCount; i++) {
    const sx = cx - 30 + (i * 47) % 60;
    const sy = cy + 17 + bob + (i * 7) % 8 - 4;
    ctx.fillStyle = `rgba(180,120,30,${0.2 + progress * 0.3})`;
    ctx.beginPath(); ctx.ellipse(sx, sy, 6, 3, (i * 0.5), 0, Math.PI * 2); ctx.fill();
  }

  // Cute face
  drawCuteEyes(cx, cy + 16 + bob, progress < 0.9);
  if (progress >= 0.9) {
    // proud smile when almost done
    drawSmile(cx, cy + 22 + bob, 6);
  } else {
    drawSmile(cx, cy + 22 + bob);
  }
  drawBlush(cx, cy + 19 + bob);

  // Steam when cooking
  if (progress > 0.15) drawSteam(cx, cy + bob - 2, 3, t, Math.min((progress - 0.15) * 0.6, 0.4));
};

// ─── Fun Facts ───────────────────────────────────────────

let currentFunFact = "";
let funFactInterval = null;

const showFunFact = () => {
  const detected = detectActivity(state.activity);
  const pool = funFacts[detected];
  if (!pool || !funFactEl) return;
  let fact;
  do { fact = pool[Math.floor(Math.random() * pool.length)]; } while (fact === currentFunFact && pool.length > 1);
  currentFunFact = fact;
  funFactEl.textContent = fact;
  funFactEl.style.display = "";
};

const hideFunFact = () => {
  if (funFactEl) funFactEl.style.display = "none";
  if (funFactInterval) { clearInterval(funFactInterval); funFactInterval = null; }
};

// ─── Completion Stats ────────────────────────────────────
const STATS_KEY = "kitchen-timer-stats";

const loadStats = () => {
  try { return JSON.parse(localStorage.getItem(STATS_KEY)) || { total: 0, byActivity: {} }; }
  catch { return { total: 0, byActivity: {} }; }
};

const recordCompletion = () => {
  const stats = loadStats();
  stats.total++;
  const act = detectActivity(state.activity) || "other";
  stats.byActivity[act] = (stats.byActivity[act] || 0) + 1;
  localStorage.setItem(STATS_KEY, JSON.stringify(stats));
  updateStatsBar();
};

const updateStatsBar = () => {
  if (!statsBarEl) return;
  const stats = loadStats();
  if (stats.total === 0) { statsBarEl.style.display = "none"; return; }
  statsBarEl.style.display = "";
  const parts = [];
  parts.push(`${stats.total} timer${stats.total === 1 ? "" : "s"} completed`);
  const top = Object.entries(stats.byActivity).sort((a, b) => b[1] - a[1])[0];
  if (top && top[1] > 1) parts.push(`${top[1]}x ${top[0]}`);
  statsBarEl.textContent = parts.join(" \u00b7 ");
};

// ─── Initialize ──────────────────────────────────────────
loadState();

notifyToggle.checked = Boolean(state.notify);

if (state.activity) {
  activityInput.value = state.activity;
  updateActivity();
}

if (state.soundTheme) {
  soundThemeBtns.forEach((btn) => {
    btn.classList.toggle("active", btn.dataset.sound === state.soundTheme);
  });
}

if (state.visualTheme) {
  applyTheme(state.visualTheme);
  themeBtns.forEach((btn) => {
    btn.classList.toggle("active", btn.dataset.theme === state.visualTheme);
  });
}

if (state.mode === "countdown") {
  updateDisplay(state.remainingSeconds);
  if (state.totalSeconds > 0) {
    updateRing(state.remainingSeconds / state.totalSeconds);
  }
} else if (state.mode === "stopwatch") {
  updateDisplay(state.stopwatchElapsedSeconds);
  updateRing(0);
} else {
  updateDisplay(0);
  updateRing(0);
}

updateButtons();
updateStatsBar();

tickInterval = setInterval(handleTick, 250);
handleTick();

window.addEventListener("beforeunload", saveState);
  </script>
